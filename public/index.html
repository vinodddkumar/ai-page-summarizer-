<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Page Summarizer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #e8eeec;
      --ink: #12201d;
      --muted: #52625e;
      --pine: #0e5a4c;
      --pine-dark: #0a4439;
      --paper: #ffffff;
      --line: #c5d2cf;
      --error: #a32b1f;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--ink);
      font-family: "Source Serif 4", Georgia, serif;
      line-height: 1.6;
    }
    main {
      max-width: 680px;
      margin: 0 auto;
      padding: 56px 20px 80px;
    }
    h1 {
      font-family: "Bricolage Grotesque", system-ui, sans-serif;
      font-weight: 700;
      font-size: clamp(2.2rem, 7vw, 3.4rem);
      line-height: 1.05;
      letter-spacing: -0.02em;
      margin: 0 0 12px;
    }
    .lede {
      margin: 0 0 32px;
      color: var(--muted);
      font-size: 1.1rem;
      max-width: 46ch;
    }
    .row { display: flex; gap: 10px; flex-wrap: wrap; }
    input[type="url"] {
      flex: 1 1 260px;
      min-width: 0;
      padding: 14px 16px;
      font: inherit;
      font-size: 1rem;
      color: var(--ink);
      background: var(--paper);
      border: 2px solid var(--line);
      border-radius: 8px;
    }
    input[type="url"]:focus { outline: none; border-color: var(--pine); }
    button {
      padding: 14px 24px;
      font-family: "Bricolage Grotesque", system-ui, sans-serif;
      font-weight: 500;
      font-size: 1rem;
      color: #fff;
      background: var(--pine);
      border: 0;
      border-radius: 8px;
      cursor: pointer;
      min-width: 140px;
    }
    button:hover:not(:disabled) { background: var(--pine-dark); }
    button:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }
    button:disabled { opacity: 0.75; cursor: progress; }

    .spinner {
      display: inline-block;
      width: 14px; height: 14px;
      margin-right: 8px;
      vertical-align: -2px;
      border: 2px solid rgba(255,255,255,0.4);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { .spinner { animation-duration: 3s; } }

    .error {
      margin-top: 20px;
      color: var(--error);
      font-weight: 600;
    }

    .result {
      margin-top: 36px;
      padding: 28px 28px 24px;
      background: var(--paper);
      border-left: 6px solid var(--pine);
      border-radius: 4px 12px 12px 4px;
    }
    .result h2 {
      margin: 0 0 4px;
      font-family: "Bricolage Grotesque", system-ui, sans-serif;
      font-size: 1.35rem;
      line-height: 1.25;
    }
    .result .source {
      display: block;
      margin-bottom: 18px;
      color: var(--muted);
      font-size: 0.9rem;
      word-break: break-all;
    }
    .result p { margin: 0 0 14px; font-size: 1.1rem; }
    .result ul { margin: 0; padding-left: 20px; }
    .result li { margin-bottom: 8px; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <main>
    <h1>Summarize any web page</h1>
    <p class="lede">Paste a link to an article or page and get the short version.</p>

    <form id="form" class="row">
      <input id="url" type="url" placeholder="https://example.com/article" required aria-label="Page URL" />
      <button id="btn" type="submit">Summarize</button>
    </form>

    <p id="error" class="error" role="alert" hidden></p>

    <section id="result" class="result" aria-live="polite" hidden>
      <h2 id="title"></h2>
      <a id="source" class="source" target="_blank" rel="noopener"></a>
      <div id="summary"></div>
    </section>
  </main>

  <script>
    const form = document.getElementById("form");
    const urlInput = document.getElementById("url");
    const btn = document.getElementById("btn");
    const errorEl = document.getElementById("error");
    const resultEl = document.getElementById("result");
    const titleEl = document.getElementById("title");
    const sourceEl = document.getElementById("source");
    const summaryEl = document.getElementById("summary");

    function setLoading(loading) {
      btn.disabled = loading;
      urlInput.disabled = loading;
      btn.innerHTML = loading ? '<span class="spinner"></span>Loading...' : "Summarize";
    }

    // Turn the AI's plain text into paragraphs + a bullet list (built with
    // textContent, so nothing from the page or AI is ever inserted as HTML).
    function renderSummary(text) {
      summaryEl.replaceChildren();
      let list = null;
      for (const raw of text.split("\n")) {
        const line = raw.trim();
        if (!line) { list = null; continue; }
        if (/^[-*•]\s+/.test(line)) {
          if (!list) {
            list = document.createElement("ul");
            summaryEl.appendChild(list);
          }
          const li = document.createElement("li");
          li.textContent = line.replace(/^[-*•]\s+/, "");
          list.appendChild(li);
        } else {
          list = null;
          const p = document.createElement("p");
          p.textContent = line;
          summaryEl.appendChild(p);
        }
      }
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      errorEl.hidden = true;
      resultEl.hidden = true;
      setLoading(true);

      try {
        const res = await fetch("/api/summarize", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ url: urlInput.value.trim() }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || "Something went wrong.");

        titleEl.textContent = data.title;
        sourceEl.textContent = data.url;
        sourceEl.href = data.url;
        renderSummary(data.summary);
        resultEl.hidden = false;
      } catch (err) {
        errorEl.textContent = err.message;
        errorEl.hidden = false;
      } finally {
        setLoading(false);
      }
    });
  </script>
</body>
</html>
